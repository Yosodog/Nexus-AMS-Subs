name: Publish Nexus Subs release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build production artifact
        run: bash scripts/build-release.sh "${GITHUB_REF_NAME}"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          [[ "${RELEASE_TAG}" == *-* ]] && prerelease=(--prerelease)
          gh release create "${RELEASE_TAG}" dist/nexus-subs.tar.gz dist/nexus-release.json \
            --verify-tag --generate-notes --title "Nexus Subs ${RELEASE_TAG}" "${prerelease[@]}"
